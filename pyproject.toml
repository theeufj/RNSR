[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rnsr"
version = "1.0.0a5"
description = "DocDB-RLM: a typed-environment recursive language model system for deep document retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Upper bounds are deliberate: provider SDKs break across majors (and
# anthropic across minors), and an unpinned floor means a fresh install of a
# tagged rnsr release can stop talking to its own providers. Raise these
# deliberately, with the model-name check in rnsr/llm/validate.py rerun.
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26,<3",
    "sqlite-vec>=0.1.6,<0.2",
    "openai>=2.0,<3",
    "anthropic>=0.100,<1",
    "google-genai>=2.0,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
# Heavy parsing stack — only needed where ingestion runs; a prebuilt
# corpus.db is queryable with the core install alone.
ingest = [
    "docling>=2.0",
    "pdfplumber>=0.11",
    "camelot-py[base]>=0.11",
    "pypdfium2>=4.30",
    "firecrawl-anydoc>=0.1.3",
]
eval = [
    "datasets>=2.19",
    "pandas>=2.0",
]
# Trajectory encryption at rest (RNSR_TRAJECTORY_KEY).
secure = [
    "cryptography>=42.0,<50",
]
# HTTP service surface (rnsr serve): health, readiness, metrics, jobs.
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "reportlab>=4.0",
]

[project.scripts]
rnsr = "rnsr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rnsr"]

[tool.hatch.build.targets.sdist]
exclude = ["testMatter/", "runs/", "terminals/", ".claude/", ".cursor/",
           "Research/", "docs/tech-meeting-*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"rnsr/cli.py" = ["B008"]  # typer's declarative Option/Argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that call real LLM providers (skipped in CI)",
]
addopts = "-m 'not live'"
