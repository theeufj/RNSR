name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          pip install -e ".[eval,dev,service,secure]"
      - name: Ruff
        run: ruff check .
      - name: Tests (LLM-free; live tests excluded by default addopts)
        run: pytest --cov=rnsr -q
      - name: Search-semantics replay
        run: pytest tests/test_replay.py -q
